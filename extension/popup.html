<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>ScopeGuard AI</title>
  <style>
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 16px;
      background: #F7F7F5;
      color: #14161B;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
      font-weight: 600;
      font-size: 14px;
    }
    .badge {
      font-size: 10px;
      background: #EEF0FF;
      color: #4338CA;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 700;
    }
    label {
      font-size: 12px;
      font-weight: 500;
      display: block;
      margin-bottom: 6px;
    }
    input {
      width: 100%;
      box-sizing: border-box;
      padding: 8px 10px;
      border: 1px solid #E7E8EB;
      border-radius: 8px;
      background: #fff;
      font-family: monospace;
      font-size: 12px;
      margin-bottom: 12px;
    }
    button {
      width: 100%;
      background: #14161B;
      color: #fff;
      border: none;
      padding: 8px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
    }
    .status {
      font-size: 11.5px;
      margin-top: 8px;
      text-align: center;
      color: #5F6672;
    }
  </style>
</head>
<body>
  <div class="header">
    <span>ScopeGuard AI</span>
    <span class="badge">PRO</span>
  </div>

  <label for="apiToken">API Token</label>
  <input type="text" id="apiToken" placeholder="sg_live_..." />

  <label for="apiUrl">App Host URL</label>
  <input type="text" id="apiUrl" value="http://localhost:3000" />

  <button id="saveBtn">Save Settings</button>
  <div id="status" class="status">Paste token from Settings → Extension.</div>

  <script src="popup.js"></script>
</body>
</html>
